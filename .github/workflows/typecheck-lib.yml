name: Typecheck lib (strict)

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]

jobs:
  typecheck-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: npm

      - run: npm ci --include=dev

      - run: npm run typecheck:lib
